<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSMC 288 單字機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout concept: dark fab-band header holding a 288-die wafer map (one die per word, lit when learned);
   content below as equipment-panel cards; mode switcher as a bottom tab bar. */
:root{
  --bg:#eef1ef; --surface:#fbfcfb; --surface-2:#e3e9e6; --ink:#12201f; --muted:#52645f; --line:#cdd7d3;
  --accent:#f2b705; --accent-ink:#2b2000; --accent-soft:#fff1c2; --accent-text:#7a5600;
  --band:#0e2a30; --band-ink:#e8f1ee; --band-muted:#9db8b3; --wafer:#0b2329; --wafer-edge:#2f5f69; --dot-off:#27484f;
  --ok:#1c7c54; --bad:#b83a2a; --focus:#0b6e8a;
  --tint1:#d9ede8; --tint2:#fff1c2; --tint3:#e3e7f6; --tint4:#f5e3dd; --dots:rgba(18,32,31,.13);
  --f-display:'Barlow Semi Condensed','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1417; --surface:#111e22; --surface-2:#192b30; --ink:#e7f0ed; --muted:#93a9a4; --line:#24383d;
    --accent:#ffc83a; --accent-ink:#241a00; --accent-soft:#2b2410; --accent-text:#ffd366;
    --band:#071a1e; --wafer:#081a1f; --wafer-edge:#2a525b; --dot-off:#21414a;
    --ok:#4cc38a; --bad:#ff8a78; --focus:#5cc4e0;
    --tint1:#12302f; --tint2:#2b2410; --tint3:#1b2338; --tint4:#33201c; --dots:rgba(231,240,237,.10); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1417; --surface:#111e22; --surface-2:#192b30; --ink:#e7f0ed; --muted:#93a9a4; --line:#24383d;
  --accent:#ffc83a; --accent-ink:#241a00; --accent-soft:#2b2410; --accent-text:#ffd366;
  --band:#071a1e; --wafer:#081a1f; --wafer-edge:#2a525b; --dot-off:#21414a;
  --ok:#4cc38a; --bad:#ff8a78; --focus:#5cc4e0;
  --tint1:#12302f; --tint2:#2b2410; --tint3:#1b2338; --tint4:#33201c; --dots:rgba(231,240,237,.10); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.inner{max-width:920px;margin:0 auto;padding-block:20px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.wafer{width:136px;height:136px;flex:none}
.wafer .base{fill:var(--wafer);stroke:var(--wafer-edge);stroke-width:2}
.wafer .notch{fill:var(--band)}
.wafer .d{fill:var(--dot-off);cursor:pointer}
.wafer .d.on{fill:var(--accent)}
.wafer .d.half{fill:var(--accent);fill-opacity:.4}
.brand-txt{flex:1 1 230px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);margin-bottom:4px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.1;margin:0 0 6px;letter-spacing:.01em}
.tagline{color:var(--band-muted);font-size:13px;margin-bottom:12px}
.meter{display:flex;align-items:center;gap:10px}
.bar{position:relative;flex:1;height:8px;border-radius:4px;background:var(--dot-off);overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);transition:width .3s}
.bar i.half{opacity:.45}
.count{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* page */
.app{max-width:920px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:baseline;gap:6px;min-height:40px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.7}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:4px 0 10px}
.ghead h2{margin:0;font-size:1.4rem;font-weight:700}
.gen{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.gsub{color:var(--muted);font-size:13.5px;flex-basis:100%}
.story{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px;line-height:2}
.story mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);border-radius:2px;padding:0 3px;font-family:var(--f-display);font-weight:600;font-size:1.06em}
.zht{display:flex;align-items:center;gap:7px;min-height:34px;margin-bottom:4px;font-size:13.5px;cursor:pointer}
.zhn{color:var(--accent-text);font-size:.92em;font-weight:500;white-space:nowrap}
.nozh .zhn{display:none}
.ph{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.ph b{color:var(--accent-text);font-weight:700}
.ph i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:18px 0 10px}
.bh h3{margin:0;font-size:1.15rem}
.bh span{color:var(--muted);font-size:13px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.pic{margin:0;display:flex;flex-direction:column;min-width:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.sc{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:220px;padding:12px;background:var(--tint1)}
.sc::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dots) 1.2px,transparent 1.6px);background-size:10px 10px;pointer-events:none}
.sc>*{position:relative}
.pic:nth-child(4n+2) .sc{background:var(--tint2)}
.pic:nth-child(4n+3) .sc{background:var(--tint3)}
.pic:nth-child(4n+4) .sc{background:var(--tint4)}
.no{align-self:flex-start;font-family:var(--f-mono);font-weight:500;font-size:12px;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 8px}
.big{text-align:center;font-size:58px;line-height:1.15;letter-spacing:.04em;overflow-wrap:anywhere;padding:2px 0}
.cap{margin:0;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.85;box-shadow:3px 3px 0 var(--ink)}
.cap mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);padding:0 3px;font-family:var(--f-display);font-weight:600;font-size:1.05em}
.tiles{list-style:none;margin:0;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border-top:2px solid var(--ink)}
.tile{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tile i{grid-row:1 / span 2;font-style:normal;font-size:24px;line-height:1;text-align:center}
.tile b{font-family:var(--f-display);font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
.tile .tz{font-size:12.5px;color:var(--muted);line-height:1.3}
.nozh .tile .tz{filter:blur(6px);cursor:pointer}
.nozh .tile.shown .tz{filter:none}
.tools{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:14px;font-size:13.5px}
.tools label,.ctl label{display:flex;align-items:center;gap:7px;min-height:34px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card.known{border-color:var(--accent);background:var(--accent-soft)}
.card.pulse{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:30px;line-height:1}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.line1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.w{font-family:var(--f-display);font-weight:700;font-size:1.42rem;line-height:1.15;overflow-wrap:anywhere}
.pos{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.trap{font-size:11px;color:var(--accent-text);border:1px solid var(--accent);border-radius:4px;padding:0 5px;line-height:1.6}
.zh{font-weight:700;font-size:1.05rem}
.hook{color:var(--muted);font-size:13.5px;line-height:1.55}
.acts{display:flex;gap:8px;margin-top:6px}
.mini{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px}
.card.known .mini{background:transparent}
.mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grid.mask .reveal{filter:blur(7px);cursor:pointer;user-select:none}
.grid.mask .card.shown .reveal{filter:none}
.empty{padding:28px 8px;color:var(--muted);text-align:center}
.reset{margin-top:26px;text-align:center}
.reset button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:40px;font-size:13px}

/* buttons */
.btn{min-height:46px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.ctl{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-bottom:12px}
.sel{display:flex;align-items:center;gap:8px}
select{min-height:40px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;max-width:100%}

/* flashcards */
.flipwrap{perspective:1200px}
.flip{position:relative;height:340px;cursor:pointer;outline-offset:3px}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.bigic{font-size:76px;line-height:1.05}
.bigw{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1.1;overflow-wrap:anywhere}
.bigzh{font-weight:700;font-size:2rem;line-height:1.25}
.hint{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em}
.fcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 8px;text-align:center}
.fbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.fbtns .btn{padding-inline:8px}
.sp{width:18px;height:18px}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.modes{display:grid;gap:8px;margin:12px 0 16px}
.modes label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.modes small{display:block;color:var(--muted)}
.qprompt{text-align:center;padding:8px 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:1.02rem}
.opt.correct{border-color:var(--ok);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt .mk{font-family:var(--f-mono);font-size:13px;font-weight:700}
.opt.correct .mk{color:var(--ok)}
.opt.wrong .mk{color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.fb b{font-family:var(--f-display);font-size:1.15rem}
.score{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;text-align:center;margin:6px 0 4px}
.wl{display:grid;gap:8px;margin:14px 0}
.wl div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row .btn{flex:1 1 150px}

.note{color:var(--muted);font-size:13.5px;line-height:1.75}
.note b{color:var(--ink)}
.stack{display:grid;gap:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:12px 0}
.kv div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.kv b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kv span{font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:8px 0}
.field label{display:flex;align-items:center;gap:8px}
input[type=date]{min-height:40px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--ink)}
.teach{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.stage{font-size:11.5px;color:var(--muted);align-self:center}
.stage.s2{color:var(--ok);font-weight:700}
.pat{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.pk{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-bottom:8px}
.pk b{font-family:var(--f-display);font-size:1.25rem}
.pk span{color:var(--muted);font-size:13.5px}
.pcs{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:baseline;gap:6px;min-height:38px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.pchip b{font-family:var(--f-display)}
.pchip span{font-size:12.5px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.hist span{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.hist span.pass{border-color:var(--ok);color:var(--ok);font-weight:700}

.card.half{border-style:dashed;border-color:var(--accent)}
.todo{list-style:none;margin:10px 0 14px;padding:0;display:grid;gap:8px}
.todo li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.todo .nm{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);font-family:var(--f-mono);font-size:13px}
.todo li.done .nm{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.todo b{display:block}
.todo .s{font-size:13px;color:var(--muted)}

.line1 .stage{margin-left:auto}
.acts{flex-wrap:wrap;align-items:center}
.zrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-bottom:4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sc .mini{background:var(--surface);border:2px solid var(--ink);min-height:34px;padding:2px 10px;font-weight:500}
mark[data-say]{cursor:pointer}
mark[data-say]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tile{grid-template-columns:32px minmax(0,1fr) auto}
.tsp{grid-column:3;grid-row:1 / span 2;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.xbar{display:grid;gap:10px;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:42px;border:0;background:none;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--band-ink);font-weight:700}
.search{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:15px;color:var(--ink)}
.xrows{display:grid;gap:8px}
.xrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.xrow.on{border-color:var(--accent);background:var(--accent-soft)}
.xi{font-size:24px;text-align:center;line-height:1}
.xm{min-width:0}
.xw{font-family:var(--f-display);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.xz{font-weight:500}
.xs{display:block;font-size:12.5px;color:var(--muted)}

.todo .go{min-height:40px;padding:4px 16px;font-size:14px}
.todo .wait{font-size:12.5px;color:var(--muted)}
[data-say]{cursor:pointer}
.card .w[data-say]{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:5px}
.card .w[data-say]:focus-visible,mark[data-say]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:560px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:6px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;font-size:12.5px}
.nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}

@media (max-width:420px){
  .wafer{width:112px;height:112px}
  h1{font-size:1.8rem}
  .bigic{font-size:64px}
  .bigw{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){
  .flip-inner,.bar i{transition:none}
}
</style>
</head>
<body>

<header class="band">
  <div class="inner">
    <div class="brand">
      <svg class="wafer" id="wafer" viewBox="0 0 210 210" role="img" aria-label="288 顆晶粒，亮起來的是已學會的單字"></svg>
      <div class="brand-txt">
        <p class="eyebrow">台積電作業員英文</p>
        <h1>288 單字機</h1>
        <p class="tagline" id="tag">同一個字隔天再答對，晶粒才會亮。</p>
        <div class="meter"><div class="bar"><i id="bar2" class="half"></i><i id="bar"></i></div><span class="count">熟練 <b id="kc">0</b> / 288</span></div>
      </div>
    </div>
  </div>

      if(p.l==='en-US'){var e=p.t.replace(/[.\/_-]+/g,' ').trim();if(e)chunks.push({t:e,l:p.l});return;}
      p.t.split(PUNCT).forEach(function(c){c=c.trim();if(c)chunks.push({t:c,l:p.l});});
    });
    chunks.forEach(function(p,i){
      var u=new SpeechSynthesisUtterance(p.t);u.lang=p.l;u.rate=p.l==='en-US'?.85:1;
      if(i===chunks.length-1)u.onend=function(){if(speakKey===key)speakKey=null;};
      ss.speak(u);
    });
  }catch(e){}
}

function zhSegs(w){return w.zh.split(/[、／\/]/).map(function(s){return s.trim();}).filter(Boolean);}
function zhOverlap(a,b){var A=zhSegs(a),B=zhSegs(b);return A.some(function(s){return B.indexOf(s)>=0;});}
function pickDistractors(w,k,key){
  var pool=WORDS.filter(function(x){return x.no!==w.no&&x.en.toLowerCase()!==w.en.toLowerCase()&&!zhOverlap(x,w);});
  var scored=pool.map(function(x){
    var s=Math.random()*1.2;
    if(CLUSTER[x.no]!==undefined&&CLUSTER[x.no]===CLUSTER[w.no])s+=3;
    if(x.en.charAt(0).toLowerCase()===w.en.charAt(0).toLowerCase())s+=1.5;
    if(x.pos===w.pos)s+=1;
    return {x:x,s:s};
  }).sort(function(a,b){return b.s-a.s;});
  var out=[],seen={};seen[w[key]]=1;
  for(var i=0;i<scored.length&&out.length<k;i++){
    var x=scored[i].x;if(seen[x[key]])continue;seen[x[key]]=1;out.push(x);
  }
  return out;
}
function randDir(){return Math.random()<.5?'en2zh':'zh2en';}
function makeQ(w,nOpts,dir){
  var key=dir==='en2zh'?'zh':'en';
  return {w:w,dir:dir,opts:shuffle([w].concat(pickDistractors(w,nOpts-1,key)))};
}
function promptHtml(w,dir){

  if(dir==='zh2en')return '<div class="bigzh">'+w.zh+'</div><div class="pos">'+w.pos+'</div>';
  return '<div class="bigic" aria-hidden="true">'+w.ic+'</div><div class="pos">這個圖示代表哪個字？</div>';
}
function optsHtml(q,picked){
  var key=q.dir==='en2zh'?'zh':'en',answered=picked!==null;
  return q.opts.map(function(o){
    var cls='opt',mk='';
    if(answered){
      if(o.no===q.w.no){cls+=' correct';mk='✓ 正確';}
      else if(o.no===picked){cls+=' wrong';mk='✗ 你選的';}
    }
    return '<button type="button" class="'+cls+'" data-pick="'+o.no+'"'+(answered?' disabled':'')+'><span>'+o[key]+'</span><span class="mk">'+mk+'</span></button>';
  }).join('');
}

/* ---------- flashcards ---------- */
function buildDeck(){
  var f=st.flash,p=poolFor(f.scope);
  f.deck=f.shuffle?shuffle(p):p;
  f.i=0;f.ok=0;f.again=0;f.note='';f.done=false;f.started=true;
}
function renderFlash(){
  var f=st.flash;if(!f.started)buildDeck();
  var back=f.from?'<div class="ctl"><button type="button" class="mini" data-act="fback">← 回到學習</button><span class="note">從「學習」跳過來的，按左邊可回到原本的位置。</span></div>':'';
  var head=back+'<div class="ctl"><label class="sel">範圍<select id="fscope">'+scopeOptions(f.scope)+'</select></label>'+
    '<label><input type="checkbox" id="fshuffle"'+(f.shuffle?' checked':'')+'>隨機順序</label></div>';
  if(!f.deck.length){
    view.innerHTML=head+'<p class="empty">這個範圍沒有字。換一組，或選「全部」。</p>';return;
  }
  if(f.done){
    view.innerHTML=head+'<div class="panel"><p class="score">'+f.deck.length+' 張</p>'+
      '<p style="text-align:center">這一輪結束。多複習清單目前有 '+extraIds().length+' 個字。</p>'+
      '<div class="row"><button type="button" class="btn" data-act="fagain">同範圍再來一輪</button><button type="button" class="btn primary" data-act="funknown">只練還沒熟練的</button></div></div>';
    return;
  }
  var w=f.deck[f.i],on=inExtra(w.no);
  view.innerHTML=head+
    '<p class="fcount">第 '+(f.i+1)+' / '+f.deck.length+' 張</p>'+(f.note?'<p class="note" style="text-align:center;margin-bottom:8px">'+f.note+'</p>':'')+

      '<div class="face back"><div class="bigzh">'+w.zh+'</div><p class="hook" style="color:var(--ink);font-size:1rem">'+w.hook+'</p><div class="hint">'+w.en+(w.flag==='t'?' · 字義特殊':'')+'</div></div>'+
    '</div></div></div>'+
    '<div class="fbtns"><button type="button" class="btn" data-xt="'+w.no+'" aria-pressed="'+on+'">'+xtLabel(w.no)+'</button><button type="button" class="btn" data-act="fflip">翻面</button><button type="button" class="btn primary" data-act="fknow">下一張</button></div>'+
    '<p class="hint" style="text-align:center;margin-top:10px">「多複習」：加入或移出清單，清單裡的字每天都會出現在「今天」的複習。閃卡不會改變熟練進度。</p>'+
    '<p style="text-align:center;margin-top:6px"><button type="button" class="mini" data-goto="'+w.no+'">在學習頁看這個字</button></p>';
}
function flipCard(){var c=$('#flipcard');if(c)c.classList.toggle('on');}
function flashNext(){

/* ---------- quiz & mock exam ---------- */
var MODES={
  mix:{name:'中英混合',desc:'中翻英、英翻中隨機出，跟真正的考試一樣'},
  en2zh:{name:'英文 → 中文',desc:'看英文，選出正確的中文'},
  zh2en:{name:'中文 → 英文',desc:'看中文，選出正確的英文'},
  pic:{name:'看圖猜字',desc:'只給圖示，選出對應的英文'}
};
function startQuiz(exam){
  var pool=exam?WORDS.slice():poolFor(Q.scope),n=exam?20:Q.n,mode=exam?'mix':Q.mode;
  if(pool.length<1){Q.phase='setup';Q.msg='這個範圍沒有字，請換一個範圍。';renderQuiz();return;}
  Q.qs=shuffle(pool).slice(0,n).map(function(w){return makeQ(w,4,mode==='mix'?randDir():mode);});
  Q.i=0;Q.score=0;Q.picked=null;Q.wrong=[];Q.msg='';Q.exam=!!exam;Q.phase='play';
  renderQuiz();
}
function renderQuiz(){
  var q=Q;
  if(q.phase==='setup'){
    var modes=Object.keys(MODES).map(function(m){
      return '<label><input type="radio" name="qmode" value="'+m+'"'+(q.mode===m?' checked':'')+'><span><b>'+MODES[m].name+'</b><small>'+MODES[m].desc+'</small></span></label>';
    }).join('');
    var hist=S.hist.slice(-8).map(function(h){return '<span class="'+(h.s===h.n?'pass':'')+'">'+h.s+'/'+h.n+'</span>';}).join('');
    view.innerHTML='<div class="stack"><div class="panel"><h2 style="margin:0 0 4px;font-size:1.3rem">模擬考</h2>'+
      '<p class="note">20 題，從全部 288 字隨機抽，中翻英、英翻中混合，每題 4 個選項。要 20 題全對才算通過。模擬考只記成績，不會改變單字的進度。</p>'+
      (hist?'<p class="hint" style="margin-top:10px">最近成績</p><div class="hist">'+hist+'</div>':'')+
      '<button type="button" class="btn primary" style="width:100%;margin-top:10px" data-act="qexam">開始模擬考</button></div>'+
      '<div class="panel"><h2 style="margin:0 0 4px;font-size:1.3rem">自選練習</h2>'+
      '<p class="note">答對、答錯都會記錄。同一個字隔天再答對，才算熟練。</p>'+
      '<div class="ctl" style="margin-top:12px"><label class="sel">範圍<select id="qscope">'+scopeOptions(q.scope)+'</select></label>'+
      '<label class="sel">題數<select id="qn"><option value="10"'+(q.n===10?' selected':'')+'>10 題</option><option value="20"'+(q.n===20?' selected':'')+'>20 題</option><option value="30"'+(q.n===30?' selected':'')+'>30 題</option></select></label></div>'+
      '<div class="modes">'+modes+'</div>'+
      (q.msg?'<p style="color:var(--bad);margin-bottom:10px">'+q.msg+'</p>':'')+
      '<button type="button" class="btn" style="width:100%" data-act="qstart">開始練習</button></div></div>';
    return;
  }
  if(q.phase==='result'){
    var n=q.qs.length,all=q.score===n;
    var wl=q.wrong.map(function(w){return '<div><b style="font-family:var(--f-display);font-size:1.15rem">'+w.en+'</b> '+w.zh+phHtml(w.no)+'<p class="hook">'+w.ic+' '+w.hook+'</p></div>';}).join('');
    view.innerHTML='<div class="panel"><p class="hint" style="text-align:center">'+(q.exam?'模擬考成績':'本次成績')+'</p><p class="score">'+q.score+' / '+n+'</p>'+
      '<p style="text-align:center">'+(q.exam?(all?'全對，這次通過。再考幾次，確認每次都穩。':'沒有全對，這次不算通過。錯的字列在下面，可以到「今天」或「測驗」的自選練習再練。'):(all?'全對！':q.wrong.length+' 個字要再加強。'))+'</p>'+
      (q.wrong.length?'<div class="wl">'+wl+'</div>':'')+
      '<div class="row"><button type="button" class="btn" data-act="qsetup">回測驗首頁</button><button type="button" class="btn primary" data-act="'+(q.exam?'qexam':'qstart')+'">再考一次</button></div></div>';
    return;
  }
  var cur=q.qs[q.i],w=cur.w,answered=q.picked!==null,ok=q.picked===w.no;
  view.innerHTML='<p class="fcount">'+(q.exam?'模擬考　':'')+'第 '+(q.i+1)+' / '+q.qs.length+' 題</p>'+
    '<div class="panel"><div class="qprompt" style="display:flex;flex-direction:column;align-items:center;gap:6px">'+promptHtml(w,cur.dir)+'</div><div class="opts">'+optsHtml(cur,q.picked)+'</div>'+
    (answered?fbHtml(w,ok,q.exam?'':extraNote(w.no,q.removedNo===w.no))+'<div class="row"><button type="button" class="btn primary" data-act="qnext">'+(q.i+1>=q.qs.length?'看成績':'下一題')+'</button></div>':'')+'</div>'+
    '<p style="text-align:center;margin-top:12px"><button type="button" class="mini" data-act="qsetup">'+(q.exam?'放棄這次模擬考':'結束練習')+'</button></p>'+(q.exam?'':'<p class="hint" style="text-align:center;margin-top:4px">答過的題目都已經記錄。</p>');
}

/* ---------- router ---------- */
function render(){
  if(st.tab==='today')renderToday();
  else if(st.tab==='learn')renderLearn();
  else if(st.tab==='flash')renderFlash();
  else renderQuiz();
  updateChrome();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tf],[data-speak],[data-say],[data-seq],[data-xt],[data-toflash],[data-xf],[data-goto],[data-g],[data-tab],[data-act],[data-pick],.reveal,.tile,#flipcard,.d');
  if(!el)return;
  var d=el.dataset;
  if(d.tf){speak(BYNO[+d.tf].en);jumpToFlash(+d.tf);return;}
  if(d.speak){speak(BYNO[d.speak].en);return;}
  if(d.say){speak(d.say);return;}
  if(d.seq!==undefined){
    var gg=GROUPS.filter(function(x){return x.id===st.gid;})[0];if(!gg)return;
    var raw=d.seq==='all'?gg.panels.map(function(p){return p.t;}).join(''):(gg.panels[+d.seq]||{}).t;
    if(raw)speakSeq(raw,d.seq==='all'?'all':'p'+d.seq);
    return;
  }
  if(d.xt){toggleExtraUI(+d.xt);return;}
  if(d.toflash){jumpToFlash(+d.toflash);return;}
  if(d.xf){st.xf=d.xf;renderLearn();return;}
  if(d.goto){goToWord(+d.goto);return;}
  if(el.classList&&el.classList.contains('d')){goToWord(ORDER[+d.i].no);return;}
  if(d.tab){st.tab=d.tab;st.armReset=false;st.armClear=false;render();window.scrollTo(0,0);return;}
  if(d.g){st.gid=d.g;st.armClear=false;render();return;}
  if(el.classList.contains('reveal')){el.closest('.card').classList.toggle('shown');return;}
  if(el.classList.contains('tile')){el.classList.toggle('shown');return;}
  if(el.id==='flipcard'){flipCard();return;}
  if(d.pick){
    var pk=+d.pick;
    if(st.tab==='today'&&T.phase==='quiz'){
      if(T.picked!==null)return;
      var it=T.queue[T.qi],ok=(pk===it.no);
      T.picked=pk;T.removedNo=null;
      if(ok){if(it.tries===0){T.ok1++;grade(it.no,true);if(extraAnswer(it.no,true)){T.removedNo=it.no;T.removed.push(it.no);}}}
      else{
        grade(it.no,false);extraAnswer(it.no,false);
        if(T.wrongSet.indexOf(it.no)<0)T.wrongSet.push(it.no);
        if(it.tries<2)T.queue.push({no:it.no,tries:it.tries+1});
      }
      renderTodayQuiz();return;
    }
    if(Q.picked!==null)return;
    var cur=Q.qs[Q.i];
    Q.picked=pk;Q.removedNo=null;
    if(pk===cur.w.no){Q.score++;if(!Q.exam){grade(cur.w.no,true);if(extraAnswer(cur.w.no,true))Q.removedNo=cur.w.no;}}
    else{Q.wrong.push(cur.w);if(!Q.exam){grade(cur.w.no,false);extraAnswer(cur.w.no,false);}}
    renderQuiz();return;
  }
  switch(d.act){
    case 'treview':startTodayQuiz('review');break;
    case 'tstart':startTeach();break;
    case 'tnext':
      S.td.taught=Math.min(S.td.list.length,S.td.list.length-T.teach.length+T.ti+1);save();
      if(T.ti>=T.teach.length-1){startTodayQuiz('new');}
      else{T.ti++;renderTeach();window.scrollTo(0,0);}
      break;
    case 'tquiz':startTodayQuiz('new');break;
    case 'tcont':if(T.next==='teach')startTeach();else startTodayQuiz('new');break;
    case 'tmore':
      S.td.list=S.td.list.concat(pickNew(5,S.td.list));S.td.done=false;save();
      T.phase='home';renderToday();break;
    case 'tqnext':
      T.qi++;
      if(T.qi>=T.queue.length){
        if(T.kind==='new'){S.td.done=true;T.next=null;}
        else{S.td.rdone=true;T.next=(S.td.list.length-S.td.taught>0)?'teach':((S.td.list.length&&!S.td.done)?'quiz':null);}
        save();T.phase='done';renderToday();
      }
      else{newTodayQ();renderTodayQuiz();}
      break;
    case 'thome':T.phase='home';renderToday();window.scrollTo(0,0);break;
    case 'tleave':
      if(T.ti>=T.teach.length-1){S.td.taught=S.td.list.length;save();}
      T.phase='home';renderToday();window.scrollTo(0,0);break;
    case 'reset':
      if(!st.armReset){st.armReset=true;renderLearn();}
      else{S.box={};S.d={};S.hist=[];S.extra={};S.td={day:0,list:[],taught:0,done:false,rdone:false};save();sync();st.armReset=false;T.phase='home';render();}
      break;
    case 'fflip':flipCard();break;
    case 'fknow':flashNext(true);break;
    case 'fback':
      var fr=st.flash.from;st.flash.from=null;
      if(fr)goToWord(fr.no);else renderFlash();
      break;
    case 'fagain':st.flash.from=null;buildDeck();renderFlash();break;
    case 'funknown':st.flash.from=null;st.flash.scope='unknown';buildDeck();renderFlash();break;
    case 'xmanage':st.tab='learn';st.gid='extra';render();window.scrollTo(0,0);break;
    case 'xdrill':
      Q.scope='extra';Q.mode='mix';st.tab='quiz';startQuiz(false);updateChrome();window.scrollTo(0,0);
      break;
    case 'xclear':
      if(!st.armClear){st.armClear=true;renderLearn();}
      else{S.extra={};save();st.armClear=false;renderLearn();}
      break;
    case 'qsetup':Q.phase='setup';Q.msg='';renderQuiz();break;
    case 'qstart':startQuiz(false);break;
    case 'qexam':startQuiz(true);break;
    case 'qnext':
      Q.i++;Q.picked=null;Q.removedNo=null;
      if(Q.i>=Q.qs.length){
        Q.phase='result';
        if(Q.exam){S.hist.push({d:today(),s:Q.score,n:Q.qs.length});S.hist=S.hist.slice(-20);save();}
      }
      renderQuiz();break;
  }
});

  else if(t.id==='mask'){st.mask=t.checked;renderLearn();}
  else if(t.id==='hard'){st.hard=t.checked;renderLearn();}
  else if(t.id==='hide'){st.hide=t.checked;renderLearn();}
  else if(t.id==='fscope'){st.flash.from=null;st.flash.scope=t.value;buildDeck();renderFlash();}
  else if(t.id==='fshuffle'){st.flash.from=null;st.flash.shuffle=t.checked;buildDeck();renderFlash();}
  else if(t.id==='qscope'){Q.scope=t.value;}
  else if(t.id==='qn'){Q.n=+t.value;}
  else if(t.name==='qmode'){Q.mode=t.value;}
  else if(t.id==='examdate'){
    S.exam=/^\d{4}-\d{2}-\d{2}$/.test(t.value)?t.value:'';
    S.td.day=0;save();renderToday();
  }
  else if(t.id==='perday'){S.perDay=+t.value|0;S.td.day=0;save();renderToday();}
  else if(t.id==='xgroup'){st.xg=t.value;renderXList();}
  else if(t.id==='xauto'){S.autoN=+t.value;save();renderXList();}
});
document.addEventListener('keydown',function(e){
  if(st.tab!=='flash'||st.flash.done||!st.flash.deck.length)return;
  var tag=e.target.tagName;
  if(tag==='SELECT'||tag==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();flashNext(true);}
  else if((e.key===' '||e.key==='Enter')&&tag!=='BUTTON'){e.preventDefault();flipCard();}
});

document.addEventListener('input',function(e){
  if(e.target.id==='xsearch'){XQ=e.target.value;renderXList();}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var m=e.target.closest&&e.target.closest('mark[data-say],.w[data-say]');
  if(m){e.preventDefault();m.click();}
});

render();
})();
</script>

</body>
</html>

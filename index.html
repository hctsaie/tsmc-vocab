<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSMC 288 單字機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout concept: dark fab-band header holding a 288-die wafer map (one die per word, lit when learned);
   content below as equipment-panel cards; mode switcher as a bottom tab bar. */
:root{
  --bg:#eef1ef; --surface:#fbfcfb; --surface-2:#e3e9e6; --ink:#12201f; --muted:#52645f; --line:#cdd7d3;
  --accent:#f2b705; --accent-ink:#2b2000; --accent-soft:#fff1c2; --accent-text:#7a5600;
  --band:#0e2a30; --band-ink:#e8f1ee; --band-muted:#9db8b3; --wafer:#0b2329; --wafer-edge:#2f5f69; --dot-off:#27484f;
  --ok:#1c7c54; --bad:#b83a2a; --focus:#0b6e8a;
  --f-display:'Barlow Semi Condensed','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1417; --surface:#111e22; --surface-2:#192b30; --ink:#e7f0ed; --muted:#93a9a4; --line:#24383d;
    --accent:#ffc83a; --accent-ink:#241a00; --accent-soft:#2b2410; --accent-text:#ffd366;
    --band:#071a1e; --wafer:#081a1f; --wafer-edge:#2a525b; --dot-off:#21414a;
    --ok:#4cc38a; --bad:#ff8a78; --focus:#5cc4e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1417; --surface:#111e22; --surface-2:#192b30; --ink:#e7f0ed; --muted:#93a9a4; --line:#24383d;
  --accent:#ffc83a; --accent-ink:#241a00; --accent-soft:#2b2410; --accent-text:#ffd366;
  --band:#071a1e; --wafer:#081a1f; --wafer-edge:#2a525b; --dot-off:#21414a;
  --ok:#4cc38a; --bad:#ff8a78; --focus:#5cc4e0; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.inner{max-width:920px;margin:0 auto;padding-block:20px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.wafer{width:136px;height:136px;flex:none}
.wafer .base{fill:var(--wafer);stroke:var(--wafer-edge);stroke-width:2}
.wafer .notch{fill:var(--band)}
.wafer .d{fill:var(--dot-off);cursor:pointer}
.wafer .d.on{fill:var(--accent)}
.brand-txt{flex:1 1 230px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);margin-bottom:4px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.1;margin:0 0 6px;letter-spacing:.01em}
.tagline{color:var(--band-muted);font-size:13px;margin-bottom:12px}
.meter{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--dot-off);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* page */
.app{max-width:920px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:baseline;gap:6px;min-height:40px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.7}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:4px 0 10px}
.ghead h2{margin:0;font-size:1.4rem;font-weight:700}
.gen{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.gsub{color:var(--muted);font-size:13.5px;flex-basis:100%}
.story{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px;line-height:2}
.story mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);border-radius:2px;padding:0 3px;font-family:var(--f-display);font-weight:600;font-size:1.06em}
.tools{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:14px;font-size:13.5px}
.tools label,.ctl label{display:flex;align-items:center;gap:7px;min-height:34px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card.known{border-color:var(--accent);background:var(--accent-soft)}
.card.pulse{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:30px;line-height:1}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.line1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.w{font-family:var(--f-display);font-weight:700;font-size:1.42rem;line-height:1.15;overflow-wrap:anywhere}
.pos{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.trap{font-size:11px;color:var(--accent-text);border:1px solid var(--accent);border-radius:4px;padding:0 5px;line-height:1.6}
.zh{font-weight:700;font-size:1.05rem}
.hook{color:var(--muted);font-size:13.5px;line-height:1.55}
.acts{display:flex;gap:8px;margin-top:6px}
.mini{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px}
.card.known .mini{background:transparent}
.mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grid.mask .reveal{filter:blur(7px);cursor:pointer;user-select:none}
.grid.mask .card.shown .reveal{filter:none}
.empty{padding:28px 8px;color:var(--muted);text-align:center}
.reset{margin-top:26px;text-align:center}
.reset button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:40px;font-size:13px}

/* buttons */
.btn{min-height:46px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.ctl{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-bottom:12px}
.sel{display:flex;align-items:center;gap:8px}
select{min-height:40px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;max-width:100%}

/* flashcards */
.flipwrap{perspective:1200px}
.flip{position:relative;height:340px;cursor:pointer;outline-offset:3px}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.bigic{font-size:76px;line-height:1.05}
.bigw{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1.1;overflow-wrap:anywhere}
.bigzh{font-weight:700;font-size:2rem;line-height:1.25}
.hint{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em}
.fcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 8px;text-align:center}
.fbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.fbtns .btn{padding-inline:8px}
.sp{width:18px;height:18px}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.modes{display:grid;gap:8px;margin:12px 0 16px}
.modes label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.modes small{display:block;color:var(--muted)}
.qprompt{text-align:center;padding:8px 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:1.02rem}
.opt.correct{border-color:var(--ok);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt .mk{font-family:var(--f-mono);font-size:13px;font-weight:700}
.opt.correct .mk{color:var(--ok)}
.opt.wrong .mk{color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.fb b{font-family:var(--f-display);font-size:1.15rem}
.score{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;text-align:center;margin:6px 0 4px}
.wl{display:grid;gap:8px;margin:14px 0}
.wl div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row .btn{flex:1 1 150px}

/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:6px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;font-size:12.5px}
.nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}

@media (max-width:420px){
  .wafer{width:112px;height:112px}
  h1{font-size:1.8rem}
  .bigic{font-size:64px}
  .bigw{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){
  .flip-inner,.bar i{transition:none}
}
</style>
</head>
<body>


<header class="band">
  <div class="inner">
    <div class="brand">
      <svg class="wafer" id="wafer" viewBox="0 0 210 210" role="img" aria-label="288 顆晶粒，亮起來的是已學會的單字"></svg>
      <div class="brand-txt">
        <p class="eyebrow">台積電作業員英文</p>
        <h1>288 單字機</h1>
        <p class="tagline" id="tag">點亮每一顆晶粒，整片晶圓全亮就通關。</p>
        <div class="meter"><div class="bar"><i id="bar"></i></div><span class="count"><b id="kc">0</b> / 288</span></div>
      </div>
    </div>
  </div>
</header>

<main class="app"><div id="view"></div></main>

<nav class="nav" aria-label="學習模式">
  <div class="in">
    <button type="button" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>學習</button>
    <button type="button" data-tab="flash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>閃卡</button>
    <button type="button" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>測驗</button>
  </div>
</nav>

(function(){
'use strict';

/* ---------- data ---------- */
var WORDS=[],BYNO={};
GROUPS.forEach(function(g){
  g.words=g.w.map(function(a){
    var o={no:a[0],en:a[1],pos:a[2],zh:a[3],ic:a[4],hook:a[5],flag:a[6]||'',g:g.id};
    WORDS.push(o);BYNO[o.no]=o;return o;
  });
});
var TOTAL=WORDS.length;
var LS_KEY='tsmc288-known-v1';
var known=new Set();
try{
  var raw=localStorage.getItem(LS_KEY);
  if(raw){JSON.parse(raw).forEach(function(n){if(BYNO[n])known.add(n);});}
}catch(e){}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(Array.from(known)));}catch(e){}}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
var view=$('#view');
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gk(g){var n=0;g.words.forEach(function(w){if(known.has(w.no))n++;});return n;}
function fmtStory(s){return s.replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');}
var CAN_SPEAK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function speak(t){
  if(!CAN_SPEAK)return;
  try{var u=new SpeechSynthesisUtterance(t.replace(/[.\/-]/g,' '));u.lang='en-US';u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}
}
var SPK='<svg class="sp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function spkBtn(no,label){return CAN_SPEAK?'<button type="button" class="mini" data-speak="'+no+'" aria-label="發音 '+BYNO[no].en+'">'+SPK+(label||'')+'</button>':'';}
function poolFor(scope){

  if(scope==='unknown')return WORDS.filter(function(w){return !known.has(w.no);});
  var g=GROUPS.filter(function(x){return x.id===scope;})[0];

}
function scopeOptions(sel){
  var un=WORDS.filter(function(w){return !known.has(w.no);}).length;
  var h='<option value="all"'+(sel==='all'?' selected':'')+'>全部 '+TOTAL+' 字</option>';
  h+='<option value="unknown"'+(sel==='unknown'?' selected':'')+'>還不會的（'+un+'）</option>';
  GROUPS.forEach(function(g){h+='<option value="'+g.id+'"'+(sel===g.id?' selected':'')+'>'+g.name+'（'+g.words.length+'）</option>';});
  return h;
}

/* ---------- state ---------- */
var st={
  tab:'learn',gid:GROUPS[0].id,mask:false,hard:false,hide:false,armReset:false,
  flash:{scope:'all',shuffle:true,deck:[],i:0,ok:0,again:0,done:false,started:false},
  quiz:{scope:'all',mode:'en2zh',phase:'setup',qs:[],i:0,score:0,picked:null,wrong:[],msg:''}
};

/* ---------- wafer map ---------- */
var ORDER=WORDS; /* display order = group order */
var dotEls=[];
(function buildWafer(){
  var n=21,c=10,cells=[],r,q;
  for(r=0;r<n;r++)for(q=0;q<n;q++)cells.push({r:r,q:q,d:Math.hypot(r-c,q-c)});
  cells.sort(function(a,b){return a.d-b.d;});
  var pick=cells.slice(0,TOTAL).sort(function(a,b){return a.r-b.r||a.q-b.q;});
  var h='<circle class="base" cx="105" cy="105" r="103"/><circle class="notch" cx="105" cy="208" r="6"/>';
  pick.forEach(function(p,i){
    var w=ORDER[i];
    h+='<circle class="d" data-i="'+i+'" cx="'+(5+p.q*10)+'" cy="'+(5+p.r*10)+'" r="3.6"><title>'+w.en+' '+w.zh+'</title></circle>';
  });
  $('#wafer').innerHTML=h;
  dotEls=Array.prototype.slice.call($('#wafer').querySelectorAll('circle.d'));
})();

function updateChrome(){
  var k=known.size;
  $('#kc').textContent=k;
  $('#bar').style.width=(k/TOTAL*100)+'%';
  $('#tag').textContent=(k===TOTAL)?'整片晶圓全亮，288 字全部通關。':'點亮每一顆晶粒，整片晶圓全亮就通關。';
  for(var i=0;i<dotEls.length;i++){dotEls[i].classList.toggle('on',known.has(ORDER[i].no));}
  Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){
    b.setAttribute('aria-current',b.dataset.tab===st.tab?'page':'false');
  });
}
function setKnown(no,v){
  if(v)known.add(no);else known.delete(no);
  persist();updateChrome();
}

/* ---------- learn ---------- */
function cardHtml(w){
  var k=known.has(w.no);
  return '<article class="card'+(k?' known':'')+'" id="w'+w.no+'">'+
    '<div class="ic" aria-hidden="true">'+w.ic+'</div>'+
    '<div class="body">'+
      '<div class="line1"><span class="w">'+w.en+'</span><span class="pos">'+w.pos+'</span>'+(w.flag==='t'?'<span class="trap">字義特殊</span>':'')+'</div>'+
      '<div class="reveal"><p class="zh">'+w.zh+'</p><p class="hook">'+w.hook+'</p></div>'+
      '<div class="acts">'+spkBtn(w.no,'')+'<button type="button" class="mini" data-know="'+w.no+'" aria-pressed="'+k+'">'+(k?'✓ 會了':'會了')+'</button></div>'+
    '</div></article>';
}
function renderLearn(){
  var prev=$('#chips'),sl=prev?prev.scrollLeft:0;
  var g=GROUPS.filter(function(x){return x.id===st.gid;})[0];
  var list=g.words;
  if(st.hard)list=list.filter(function(w){return w.flag!=='e';});
  if(st.hide)list=list.filter(function(w){return !known.has(w.no);});
  var chips=GROUPS.map(function(x){
    return '<button type="button" class="chip" data-g="'+x.id+'" aria-pressed="'+(x.id===g.id)+'">'+x.name+'<small>'+gk(x)+'/'+x.words.length+'</small></button>';
  }).join('');
  view.innerHTML=
    '<div class="chips" id="chips">'+chips+'</div>'+
    '<div class="ghead"><h2>'+g.name+'</h2><span class="gen">'+g.en+'</span><span class="gsub">'+g.sub+'</span></div>'+
    '<p class="story">'+fmtStory(g.story)+'</p>'+
    '<div class="tools">'+
      '<label><input type="checkbox" id="mask"'+(st.mask?' checked':'')+'>遮住中文自測（點卡片揭曉）</label>'+
      '<label><input type="checkbox" id="hard"'+(st.hard?' checked':'')+'>只看難字</label>'+
      '<label><input type="checkbox" id="hide"'+(st.hide?' checked':'')+'>隱藏已會</label>'+
    '</div>'+
    '<div class="grid'+(st.mask?' mask':'')+'">'+(list.length?list.map(cardHtml).join(''):'<p class="empty">這一組沒有符合條件的字。</p>')+'</div>'+
    '<div class="reset"><button type="button" data-act="reset">'+(st.armReset?'再按一次，清除全部進度':'清除我的進度')+'</button></div>';
  var ch=$('#chips'),act=ch.querySelector('[aria-pressed="true"]');
  if(prev){ch.scrollLeft=sl;}
  if(act&&!prev){ch.scrollLeft=Math.max(0,act.offsetLeft-(ch.clientWidth-act.offsetWidth)/2);}
}
function patchLearnCard(no){
  var card=document.getElementById('w'+no);if(!card)return;
  var k=known.has(no);
  card.classList.toggle('known',k);
  var b=card.querySelector('[data-know]');
  b.setAttribute('aria-pressed',k);b.textContent=k?'✓ 會了':'會了';
  GROUPS.forEach(function(g){
    var c=document.querySelector('.chip[data-g="'+g.id+'"] small');
    if(c)c.textContent=gk(g)+'/'+g.words.length;
  });
}
function goToWord(no){
  var w=BYNO[no];st.tab='learn';st.gid=w.g;st.hard=false;st.hide=false;
  render();
  var el=document.getElementById('w'+no);
  if(el){
    el.scrollIntoView({block:'center'});
    el.classList.add('pulse');
    setTimeout(function(){el.classList.remove('pulse');},1600);
  }
}

/* ---------- flashcards ---------- */
function buildDeck(){
  var f=st.flash,p=poolFor(f.scope);
  f.deck=f.shuffle?shuffle(p):p;
  f.i=0;f.ok=0;f.again=0;f.done=false;f.started=true;
}
function renderFlash(){
  var f=st.flash;if(!f.started)buildDeck();
  var head='<div class="ctl"><label class="sel">範圍<select id="fscope">'+scopeOptions(f.scope)+'</select></label>'+
    '<label><input type="checkbox" id="fshuffle"'+(f.shuffle?' checked':'')+'>隨機順序</label></div>';
  if(!f.deck.length){
    view.innerHTML=head+'<p class="empty">這個範圍的字你都學會了。換一組，或選「全部」再複習一次。</p>';return;
  }
  if(f.done){
    view.innerHTML=head+'<div class="panel"><p class="score">'+f.ok+' / '+f.deck.length+'</p>'+
      '<p style="text-align:center">這一輪結束：會了 '+f.ok+' 張，要再看 '+f.again+' 張。</p>'+
      '<div class="row"><button type="button" class="btn" data-act="fagain">同範圍再來一輪</button><button type="button" class="btn primary" data-act="funknown">只練還不會的</button></div></div>';
    return;
  }
  var w=f.deck[f.i];
  view.innerHTML=head+
    '<p class="fcount">第 '+(f.i+1)+' / '+f.deck.length+' 張</p>'+
    '<div class="flipwrap"><div class="flip" id="flipcard" role="button" tabindex="0" aria-label="翻面看中文"><div class="flip-inner">'+
      '<div class="face"><div class="bigic" aria-hidden="true">'+w.ic+'</div><div class="bigw">'+w.en+'</div><div class="pos">'+w.pos+'</div>'+spkBtn(w.no,' 發音')+'<div class="hint">點卡片翻面</div></div>'+
      '<div class="face back"><div class="bigzh">'+w.zh+'</div><p class="hook" style="color:var(--ink);font-size:1rem">'+w.hook+'</p><div class="hint">'+w.en+(w.flag==='t'?' · 字義特殊':'')+'</div></div>'+
    '</div></div></div>'+
    '<div class="fbtns"><button type="button" class="btn" data-act="fagainone">再看一次</button><button type="button" class="btn" data-act="fflip">翻面</button><button type="button" class="btn primary" data-act="fknow">會了</button></div>'+
    '<p class="hint" style="text-align:center;margin-top:10px">鍵盤：空白鍵翻面，→ 會了，← 再看一次</p>';
}
function flipCard(){var c=$('#flipcard');if(c)c.classList.toggle('on');}
function flashNext(ok){
  var f=st.flash,w=f.deck[f.i];if(!w)return;
  setKnown(w.no,ok);
  if(ok)f.ok++;else f.again++;
  f.i++;if(f.i>=f.deck.length)f.done=true;
  renderFlash();
}

/* ---------- quiz ---------- */
var MODES={
  en2zh:{name:'英文 → 中文',desc:'看英文，選出正確的中文'},
  zh2en:{name:'中文 → 英文',desc:'看中文，選出正確的英文'},
  pic:{name:'看圖猜字',desc:'只給圖示，選出對應的英文'}
};
function makeQs(pool,mode){
  var key=mode==='en2zh'?'zh':'en';
  return shuffle(pool).slice(0,10).map(function(w){
    var cand=shuffle(WORDS.filter(function(x){return x.no!==w.no&&x[key]!==w[key];}));
    var same=cand.filter(function(x){return x.pos===w.pos;}),rest=cand.filter(function(x){return x.pos!==w.pos;});
    return {w:w,opts:shuffle([w].concat(same.concat(rest).slice(0,3)))};
  });
}
function renderQuiz(){
  var q=st.quiz;
  if(q.phase==='setup'){
    var modes=Object.keys(MODES).map(function(m){
      return '<label><input type="radio" name="qmode" value="'+m+'"'+(q.mode===m?' checked':'')+'><span><b>'+MODES[m].name+'</b><small>'+MODES[m].desc+'</small></span></label>';
    }).join('');
    view.innerHTML='<div class="panel"><h2 style="margin:0 0 4px;font-size:1.3rem">10 題小測驗</h2>'+
      '<p style="color:var(--muted)">答對的字會自動標成「會了」，答錯的會取消，晶圓上的亮點跟著變。</p>'+
      '<div class="ctl" style="margin-top:12px"><label class="sel">範圍<select id="qscope">'+scopeOptions(q.scope)+'</select></label></div>'+
      '<div class="modes">'+modes+'</div>'+
      (q.msg?'<p style="color:var(--bad);margin-bottom:10px">'+q.msg+'</p>':'')+
      '<button type="button" class="btn primary" style="width:100%" data-act="qstart">開始測驗</button></div>';
    return;
  }
  if(q.phase==='result'){
    var n=q.qs.length;
    var wl=q.wrong.map(function(w){return '<div><b style="font-family:var(--f-display);font-size:1.15rem">'+w.en+'</b> '+w.zh+'<p class="hook">'+w.ic+' '+w.hook+'</p></div>';}).join('');
    view.innerHTML='<div class="panel"><p class="hint" style="text-align:center">本次成績</p><p class="score">'+q.score+' / '+n+'</p>'+
      '<p style="text-align:center">'+(q.score===n?'全對！這 '+n+' 個字已點亮。':(q.wrong.length+' 個字要再加強，已先取消標記。'))+'</p>'+
      (q.wrong.length?'<div class="wl">'+wl+'</div>':'')+
      '<div class="row"><button type="button" class="btn" data-act="qsetup">換範圍或模式</button><button type="button" class="btn primary" data-act="qstart">再測一次</button></div></div>';
    return;
  }
  var cur=q.qs[q.i],w=cur.w,mode=q.mode,key=mode==='en2zh'?'zh':'en';
  var prompt;
  if(mode==='en2zh')prompt='<div class="bigw">'+w.en+'</div><div class="pos">'+w.pos+'</div>'+spkBtn(w.no,' 發音');
  else if(mode==='zh2en')prompt='<div class="bigzh">'+w.zh+'</div><div class="pos">'+w.pos+'</div>';
  else prompt='<div class="bigic" aria-hidden="true">'+w.ic+'</div><div class="pos">這個圖示代表哪個字？</div>';
  var answered=q.picked!==null;
  var opts=cur.opts.map(function(o){
    var cls='opt',mk='';
    if(answered){
      if(o.no===w.no){cls+=' correct';mk='✓ 正確';}
      else if(o.no===q.picked){cls+=' wrong';mk='✗ 你選的';}
    }
    return '<button type="button" class="'+cls+'" data-pick="'+o.no+'"'+(answered?' disabled':'')+'><span>'+o[key]+'</span><span class="mk">'+mk+'</span></button>';
  }).join('');
  var fb='';
  if(answered){
    var okk=q.picked===w.no;
    fb='<div class="fb"><p><b>'+w.en+'</b>　'+w.zh+'　<span class="pos">'+(okk?'答對了':'答錯了')+'</span></p><p class="hook" style="color:var(--ink)">'+w.ic+' '+w.hook+'</p></div>'+
       '<div class="row"><button type="button" class="btn primary" data-act="qnext">'+(q.i+1>=q.qs.length?'看成績':'下一題')+'</button></div>';
  }
  view.innerHTML='<p class="fcount">第 '+(q.i+1)+' / '+q.qs.length+' 題</p>'+
    '<div class="panel"><div class="qprompt" style="display:flex;flex-direction:column;align-items:center;gap:6px">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb+'</div>';
}

/* ---------- router ---------- */
function render(){
  if(st.tab==='learn')renderLearn();
  else if(st.tab==='flash')renderFlash();
  else renderQuiz();
  updateChrome();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-speak],[data-know],[data-g],[data-tab],[data-act],[data-pick],.reveal,#flipcard,.d');
  if(!el)return;
  var d=el.dataset;
  if(d.speak){speak(BYNO[d.speak].en);return;}
  if(el.classList&&el.classList.contains('d')){goToWord(ORDER[+d.i].no);return;}
  if(d.tab){st.tab=d.tab;st.armReset=false;render();window.scrollTo(0,0);return;}
  if(d.g){st.gid=d.g;render();return;}
  if(d.know){
    var no=+d.know,v=!known.has(no);
    setKnown(no,v);
    if(st.hide&&v)render();else patchLearnCard(no);
    return;
  }
  if(el.classList.contains('reveal')){el.closest('.card').classList.toggle('shown');return;}
  if(el.id==='flipcard'){flipCard();return;}
  if(d.pick){
    var q=st.quiz;if(q.picked!==null)return;
    var cur=q.qs[q.i],no2=+d.pick;
    q.picked=no2;
    if(no2===cur.w.no){q.score++;setKnown(cur.w.no,true);}
    else{q.wrong.push(cur.w);setKnown(cur.w.no,false);}
    renderQuiz();return;
  }
  switch(d.act){
    case 'reset':
      if(!st.armReset){st.armReset=true;renderLearn();}
      else{known.clear();persist();st.armReset=false;render();}
      break;
    case 'fflip':flipCard();break;
    case 'fknow':flashNext(true);break;
    case 'fagainone':flashNext(false);break;
    case 'fagain':buildDeck();renderFlash();break;
    case 'funknown':st.flash.scope='unknown';buildDeck();renderFlash();break;
    case 'qsetup':st.quiz.phase='setup';st.quiz.msg='';renderQuiz();break;
    case 'qstart':
      var pool=poolFor(st.quiz.scope);
      if(pool.length<4){st.quiz.phase='setup';st.quiz.msg='這個範圍的字太少，請換一個範圍。';renderQuiz();break;}
      st.quiz.qs=makeQs(pool,st.quiz.mode);st.quiz.i=0;st.quiz.score=0;st.quiz.picked=null;st.quiz.wrong=[];st.quiz.msg='';st.quiz.phase='play';
      renderQuiz();break;
    case 'qnext':
      st.quiz.i++;st.quiz.picked=null;
      if(st.quiz.i>=st.quiz.qs.length)st.quiz.phase='result';
      renderQuiz();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='mask'){st.mask=t.checked;renderLearn();}
  else if(t.id==='hard'){st.hard=t.checked;renderLearn();}
  else if(t.id==='hide'){st.hide=t.checked;renderLearn();}
  else if(t.id==='fscope'){st.flash.scope=t.value;buildDeck();renderFlash();}
  else if(t.id==='fshuffle'){st.flash.shuffle=t.checked;buildDeck();renderFlash();}
  else if(t.id==='qscope'){st.quiz.scope=t.value;}
  else if(t.name==='qmode'){st.quiz.mode=t.value;}
});
document.addEventListener('keydown',function(e){
  if(st.tab!=='flash'||st.flash.done||!st.flash.deck.length)return;
  var tag=e.target.tagName;
  if(tag==='SELECT'||tag==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();flashNext(true);}
  else if(e.key==='ArrowLeft'){e.preventDefault();flashNext(false);}
  else if((e.key===' '||e.key==='Enter')&&tag!=='BUTTON'){e.preventDefault();flipCard();}
});

render();
})();
</script>

</body>
</html>
